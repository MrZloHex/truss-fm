# trufm.conf -- the config `make run` and `make gui` use, for trying things
# out here without touching ~/.config/trufm/config. Every key, with what it
# means: trufm.conf.example. `make run CONF=other.conf` for another file

hidden = true
root_hidden = false

sort = name
sort_desc = false

confirm_delete = true

places_width = 15
root_width = 25
preview_width = 20

places.standard = true
places.devices = true
place = w ~/Projects | Projects

open.txt,md,pl,conf = term: ${EDITOR:-vim}
open.png,jpg,jpeg,gif = imv
open.pdf = zathura
open.text/* = term: ${EDITOR:-vim}

preview.py,md,sh,c,h,pl,conf = bat --color=always --style=plain --paging=never %f
preview.jpg,jpeg,webp,gif = image: magick %f[0] -resize '600x600>' -depth 8 ppm:-
preview.pdf = image: pdftoppm -png -r 40 -f 1 -l 1 %f
preview.zip,tar,gz = bsdtar -tf %f

tab = /tmp

# color.accent = #87afd7
