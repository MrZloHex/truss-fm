# pluf.conf -- the config `make run` and `make gui` use, for trying things
# out here without touching ~/.config/pluf/config. Every key, with what it
# means: pluf.conf.example. `make run CONF=other.conf` for another file

hidden = true
root_hidden = false

sort = name
sort_desc = false

confirm_delete = true

places_width = 15
root_width = 25
preview_width = 20

places.standard = true
places.devices = true
place = w ~/Projects | Projects

open.txt,md,pl,conf = term: ${EDITOR:-vim}
open.png,jpg,jpeg,gif = imv
open.pdf = zathura

tab = /tmp

# color.accent = #87afd7
